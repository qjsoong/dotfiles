set -g mouse on                 # Enable mouse support
set -g base-index 1             # Start window numbers at 1
setw -g pane-base-index 1       # Start pane numbers at 1
set -g renumber-windows on      # Renumber windows after closing
setw -g mode-keys vi            # Use Vi-style key bindings in copy mode

# Sync copied text with the system clipboard via OSC 52
set -s set-clipboard on         
set -as terminal-features ',st-256color:clipboard'

# Vim-like selection and yank in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
